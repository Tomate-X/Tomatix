<script>

    let senhaReal = ""; // variável global para guardar a senha

        function mascararSenha() {
            let valorDigitado = senha.value;

            // se digitou algo a mais
            if (valorDigitado.length > senhaReal.length) {
                let ultimoDigito = valorDigitado[valorDigitado.length - 1];
                senhaReal += ultimoDigito;
            }
            // se apagou algum valor
            else if (valorDigitado.length < senhaReal.length) {
                let novaSenha = "";
                let x = 0;
                while (x < valorDigitado.length) {
                    novaSenha += senhaReal[x];
                    x++;
                }
                senhaReal = novaSenha;
            }

            // faz os asteriscos 
            let asteriscos = "";
            let y = 0;
            while (y < senhaReal.length) {
                asteriscos += "*";
                y++;
            }
            senha.value = asteriscos;
        }

        function entrar() {
            let emailUser = email.value;
            let senhaUser = senhaReal;

            let loginValido = 1;
            let senhaValido = 1;
            let emailValido = 1;

            // validação de campos vazios
            if (emailUser == "") {
                loginValido = 0;
                emailValido = 0;
                
            }
            if (senhaUser == "") {
                loginValido = 0;
                senhaValido = 0;
            }

            if (loginValido == 0 && emailValido == 0 && senhaValido == 0) {
                alert("Por favor, preencha todos os campos!");
            }

            else if (emailUser != "fernando.brandao@email.com" && emailUser != "julia.araripe@email.com" && emailUser != "marcos.antonio@email.com") {
                emailValido = 0;
                 alert("Usuário inválido ou inexistente!");
            }

            else if (emailValido == 1 && (senhaUser != "olhaarotina!" && senhaUser != "12345678" && senhaUser != "morangos!")) {
                senhaValido = 0;
                 alert("Senha incorreta ou inválida!");
            }

            else if (senhaValido == 0 || emailValido == 0) {
                alert("Por favor, entre com um usuário cadastrado!");
            }

             else {
                // censura a senha no console 
                let senhaCensurada = "";
                let i = 0;
                while (i < senhaUser.length) {
                    senhaCensurada += "*";
                    i++;
                }

                console.log("E-mail:", emailUser);
                console.log("Senha:", senhaCensurada);

                alert("Login efetuado com sucesso!"); // o <a> href faz ele ir direto pra página se tudo passar até aqui

                // mesma lógica do div.innerHTML, só que pra trocar o # do <a> pelo link certo
                linkLogin.href = "../Tela-Dashboard/dashboard.html";
            }
        }

    </script>
