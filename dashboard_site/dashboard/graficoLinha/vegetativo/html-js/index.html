<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TOMATIX | Vegetativo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <div class="app">

    <header class="topbar">
      <div class="usuario">
        <span class="usuario__avatar" aria-hidden="true">AS</span>
        <span class="usuario__texto">
          <span class="usuario__saudacao">Olá,</span>
          <span class="usuario__nome">Antônio Silva</span>
        </span>
      </div>

      <div class="topbar__acoes">
        <button type="button" class="pill">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span>Estufas</span>
        </button>

        <button type="button" class="pill pill--primario">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>Histórico</span>
        </button>
      </div>
    </header>

    <div class="app__body">

      <aside class="sidebar">
        <img class="logo" src="../assets/Logo%20Branca%20Tomatix.svg" alt="TOMATIX">

        <div class="estufa-seletor">
          <button type="button" class="estufa" aria-expanded="false" aria-haspopup="true"
            aria-controls="menu-estufas">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
              <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
            </svg>
            <span class="estufa__texto">Vegetativa</span>
            <svg class="estufa__seta" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <ul class="estufa-menu" id="menu-estufas" hidden>
            <li>
              <a class="estufa-menu__item" href="../../mudas/html-js/index.html">Mudas</a>
            </li>
            <li>
              <a class="estufa-menu__item" href="../../reproducao/html-js/index.html">Reprodução</a>
            </li>
            <li>
              <a class="estufa-menu__item" href="index.html" aria-current="page">Vegetativa</a>
            </li>
          </ul>
        </div>

        <button type="button" class="alertas">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
          </svg>
          Alertas
        </button>
      </aside>

      <main class="conteudo">

        <section class="kpis" aria-label="Indicadores do período">
          <article class="kpi kpi--neutro">
            <span class="kpi__label">Leitura atual</span>
            <span class="kpi__valor" id="kpiLeituraAtual">&mdash;</span>
            <span class="kpi__unidade">PPFD</span>
          </article>

          <article class="kpi kpi--abaixo">
            <span class="kpi__label">Abaixo</span>
            <span class="kpi__valor" id="kpiAbaixo">&lt; 162</span>
            <span class="kpi__unidade">PPFD</span>
          </article>

          <article class="kpi kpi--adequado">
            <span class="kpi__label">Adequado</span>
            <span class="kpi__valor" id="kpiAdequado">162 a 185</span>
            <span class="kpi__unidade">PPFD</span>
          </article>

          <article class="kpi kpi--elevado">
            <span class="kpi__label">Elevado</span>
            <span class="kpi__valor" id="kpiElevado">&gt; 185</span>
            <span class="kpi__unidade">PPFD</span>
          </article>
        </section>

        <section class="grafico" aria-label="Gráfico de PPFD por hora">
          <div class="grafico__eixo-y" id="eixoY" aria-hidden="true"></div>

          <div class="grafico__area" id="area">
            <div class="grafico__grade" id="grade" aria-hidden="true"></div>

            <svg class="grafico__svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <line class="limite limite--elevado" id="limiteElevado" x1="0" x2="100"></line>
              <line class="limite limite--abaixo" id="limiteAbaixo" x1="0" x2="100"></line>
              <polyline class="trilha" id="trilha"></polyline>
            </svg>

            <div class="grafico__pontos" id="pontos"></div>
          </div>

          <div class="grafico__eixo-x" id="eixoX" aria-hidden="true"></div>
        </section>

      </main>

    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
