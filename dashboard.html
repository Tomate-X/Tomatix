<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomatix - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

                        <!--Navbar-->

                          <!--Gráfico-->
    <section class="grafico">
      <div class="fases-container">
               <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-leaf preview-icon "><path d="M11 20a10 10 0 0010-10 25.9 25.9 0 00-1.04-7.281 1 1 0 00-1.755-.325C15.833 5.5 13 5.5 9.8 6.1A7 7 0 0011 20"/><path d="M2 21a5 5 0 012.911-4.544C7.613 15.212 8.351 15.24 11 13"/></svg>
            <select name="fasesTomate" id="fasesTomate" onchange="selecionarFase()">
              <option value="muda">Muda</option>
              <option value="vegetativa">Vegetativa</option>
              <option value="reprodutiva">Reprodutiva</option>
            </select>
            </div>

      </div>
        <div class="grafico-container">
          <!--KPI Leitura atual-->
          <div class="kpis leitura">
            <div>
              <p class="kpi-title">LEITURA ATUAL</p>
              <p class="ppfd-atual">70</p>
              <p class="kpi-title">PPFD</p>
            </div>
              <span class="situacao">ADEQUADO</span>
          </div>

           <!--KPI Métricas-->
          <div class="metricas">
            <div class="kpis adequado">
              <p>>255 & <347 </p>
            </div>
            <div class="kpis abaixo">
              <p><255</p>
            </div>
            <div class="kpis elevado">
              <p>>347</p>
            </div>
          </div>
          <!--Gráfico da leitura-->
            <canvas id="myChart"></canvas>
        </div>
    </section>
   

</body>

</html>
<script>
  const ctx = document.getElementById('myChart');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['Dia:5', 'Dia:10', 'Dia:15', 'Dia:20', 'Dia:25', 'Dia:30'],
      datasets: [{
        label: 'ppfd',
        data: [240, 280, 320, 358, 337, 302], 
        borderColor: 'dark grey',
        backgroundColor:'yellow',
        borderWidth: 1
      },
      {
        label: 'ppfd (Ideal)',
        data: [301, 301, 301, 301, 301, 301], 
        borderColor: 'green', // Cor da linha 
        borderWidth: 2,
        borderDash: [5, 5], // Cria um efeito de linha tracejada
        pointRadius: 0, // Remove os pontos 
      }
    ]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>
