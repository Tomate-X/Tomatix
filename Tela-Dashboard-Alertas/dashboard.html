<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomatix - Dashboard Alertas</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="main">
                          <!--Gráfico-->
    <section class="dashboard">
      <div class="menu-lateral">
        
        <div>
          <div class="logo-div">
            <img src="../Site-Institucional/assets/Logo Branca Tomatix.svg" alt="" class="logo">
          </div>
          
          <div class="btns-container">
            <a class="menu-buttons">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house preview-icon"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              Home</a>
            <a class="menu-buttons"> <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clock preview-icon"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
              Registro</a>
          </div>
        </div>
      
      
      <div class="user">
        <div>FB</div>
        <p>Olá,<br> <span>Fernando Brandão</span></p>
      </div>

      </div>

        <div class="dashboard-content">
          <div class="title-estufas">
            <div style="display: flex; flex-direction: column;gap: 10px;">
              <h1>Registro de Alertas da Estufa de Mudas</h1>
              <p style="font-weight:700; color: rgb(65, 65, 65);">Alertas disparados durante a semana</p>
            </div>
            
            <div class="inputs-container">
            <div class="estufas-container">

            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar preview-icon"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg> 
            <select id="select-data">
              <option value="">Útimos 7 Dias</option>
              
            </select>
            </div>

            <div class="estufas-container">
               <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-leaf preview-icon "><path d="M11 20a10 10 0 0010-10 25.9 25.9 0 00-1.04-7.281 1 1 0 00-1.755-.325C15.833 5.5 13 5.5 9.8 6.1A7 7 0 0011 20"/><path d="M2 21a5 5 0 012.911-4.544C7.613 15.212 8.351 15.24 11 13"/></svg>
            <select name="estufasTomate" id="estufasTomate" onchange="selecionarestufa()">
              <option value="" disabled selected>Selecione uma estufa</option>
              <option value="muda">Estufa 01</option>
              <option value="vegetativa">Estufa 02</option>
              <option value="reprodutiva">Estufa 03</option>
            </select>
            </div>
          </div>
          </div>
            
           
            <div class="grafico-container">
            <!--KPI Leitura atual-->
            <div class="kpi-container">

            <div class="kpis leitura">
              <div class="stats">
                <p class="kpi-title">TOTAL DE ALERTAS SEMANA</p>
                <p class="kpi-dado">22</p>
                <p class="kpi-title">ALERTAS</p>
              </div>
            </div>

            <div class="kpis leitura cuidado">
              <div class="stats">
                <p class="kpi-title">ALERTAS EM ESTADO DE CUIDADO</p>
                <p class="kpi-dado">13</p>
                <p class="kpi-title">ALERTAS</p>
              </div>
            </div>

            <div class="kpis leitura critico">
              <div class="stats">
                <p class="kpi-title">ALERTAS EM ESTADO DE CRÍTICO</p>
                <p class="kpi-dado">9</p>
                <p class="kpi-title">ALERTAS</p>
              </div>
            </div>

          </div>
            
            <!--Gráfico da leitura-->
            <div class="res">
              <canvas id="myChart"></canvas>
            </div>

          </div>
        </div>
      
        
    </section>
</div>

</body>

</html>
<script>
const ctx = document.getElementById('myChart');
// Quantidade de alertas de cuidado
const vegetativaAlertasCuidado = [2, 4, 3, 2, 1, 2]
const mudasAlertasCuidado = [2, 4, 1, 2, 1, 2];
const reprodutivaAlertasCuidado = [2, 4, 1, 2, 3, 2];

// Quantidade de alertas criticos
const vegetativaAlertasCriticos = [3, 5, 2, 1, 1, 3];
const mudasAlertasCriticos = [2, 1, 1, 1, 2, 1];
const reprodutivaAlertasCriticos = [2, 1, 1, 3, 2, 4];

let grafico1 = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'],
        datasets: [
          {
            label: 'Alertas abaixo do normal',
            data: [2, 4, 1, 2, 1, 2,1],
            backgroundColor: 'rgba(226, 181, 44 )',
            borderColor: 'rgba(226, 181, 44 )',
            borderWidth: 1
          },
          {
            label: 'Alertas acima do normal',
            data: [2, 1, 1, 1, 2, 1,1],
            backgroundColor: 'rgba(200, 74, 62 )',
            borderColor: 'rgba(200, 74, 62 )',
            borderWidth: 1
          }
        ]
      },
       options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });

function selecionarestufa(){
  const estufa = estufasTomate.value
  console.log(estufa)

  if(estufa =='muda'){
    grafico1.data.datasets[0].data = mudasAlertasCuidado
    grafico1.data.datasets[1].data = mudasAlertasCriticos
    grafico1.update()
  }
  if(estufa == 'vegetativa'){
    grafico1.data.datasets[0].data = vegetativaAlertasCuidado
    grafico1.data.datasets[1].data = vegetativaAlertasCriticos
    grafico1.update()
  }
  if(estufa == 'reprodutiva'){
    grafico1.data.datasets[0].data = reprodutivaAlertasCuidado
    grafico1.data.datasets[1].data = reprodutivaAlertasCriticos
    grafico1.update()
    
  }
}

</script>
