<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estufas - Tomatix</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <img class="logo" src="assets/logo-tomatix.svg" alt="Tomatix">

            <nav class="menu" aria-label="Menu principal">
                <button class="menu-item menu-item--home" type="button">
                    <img class="menu-icone" src="assets/icone-sol.png" alt="">
                    <span>Home</span>
                </button>
                <button class="menu-item menu-item--ativo" type="button" aria-current="page">
                    <img class="menu-icone" src="assets/icone-planta.png" alt="">
                    <span>Estufas</span>
                </button>
                <button class="menu-item" type="button">
                    <img class="menu-icone" src="assets/icone-ajuda.png" alt="">
                    <span>Ajuda</span>
                </button>
            </nav>

            <div class="usuario">
                <span class="avatar" aria-hidden="true">FB</span>
                <span class="usuario-texto">
                    <span class="usuario-saudacao">Olá,</span>
                    <strong class="usuario-nome">Fernando Brandão</strong>
                </span>
            </div>
        </aside>

        <main class="conteudo">
            <p class="saudacao">Olá, Fernando Brandão</p>
            <h1 class="titulo">Visão Geral das Estufas</h1>
            <p class="subtitulo">Acompanhe a condição luminosa das estufas vinculadas a esta unidade.</p>

            <section class="marcadores" aria-label="Legenda de status">
                <div class="marcador marcador--adequado">Adequado</div>
                <div class="marcador marcador--critico">Estado Crítico</div>
                <div class="marcador marcador--alerta">Em Alerta</div>
            </section>

            <section class="retangulos" aria-label="Estufas">
                <button class="retangulo retangulo--adequado" type="button" aria-label="Estufa adequada" id="estufa-01"></button>
                <button class="retangulo retangulo--alerta" type="button" aria-label="Estufa em alerta" id="estufa-02"></button>
                <button class="retangulo retangulo--adequado" type="button" aria-label="Estufa adequada" id="estufa-03"></button>
                <button class="retangulo retangulo--critico" type="button" aria-label="Estufa em estado crítico" id="estufa-04"></button>
                <button class="retangulo retangulo--adequado" type="button" aria-label="Estufa adequada" id="estufa-05"></button>
                <button class="retangulo retangulo--alerta" type="button" aria-label="Estufa em alerta" id="estufa-06"></button>
            </section>
        </main>
    </div>
    <script>
        document.getElementById("estufa-01").innerHTML = `<span class="retangulo-nome">Estufa 01</span>`;
        document.getElementById("estufa-02").innerHTML = `<span class="retangulo-nome">Estufa 02</span>`;
        document.getElementById("estufa-03").innerHTML = `<span class="retangulo-nome">Estufa 03</span>`;
        document.getElementById("estufa-04").innerHTML = `<span class="retangulo-nome">Estufa 04</span>`;
        document.getElementById("estufa-05").innerHTML = `<span class="retangulo-nome">Estufa 05</span>`;
        document.getElementById("estufa-06").innerHTML = `<span class="retangulo-nome">Estufa 06</span>`;
    </script>
</body>
</html>
