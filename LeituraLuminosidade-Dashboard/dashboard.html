<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomatix - Dashboard Alertas</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="main">
    <section class="dashboard">

      <!-- Menu lateral -->
      <div class="menu-lateral">

        <div>
          <div class="logo-div">
            <img src="../Site-Institucional/assets/Logo Branca Tomatix.svg" alt="Tomatix" class="logo">
          </div>

          <div class="btns-container">
            <a class="menu-buttons">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              Home</a>
            <a class="menu-buttons">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clock"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
              Registro</a>
          </div>
        </div>
        
        <div class="user">
          <div>FB</div>
          <p>Olá,<br> <span>Fernando Brandão</span></p>
        </div>
      </div>

      <!-- Conteúdo principal -->
      <div class="dashboard-content">
        <div class="seletor-estufa">
            <div class="fases-container">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-leaf"><path d="M11 20a10 10 0 0010-10 25.9 25.9 0 00-1.04-7.281 1 1 0 00-1.755-.325C15.833 5.5 13 5.5 9.8 6.1A7 7 0 0011 20"/><path d="M2 21a5 5 0 012.911-4.544C7.613 15.212 8.351 15.24 11 13"/></svg>
              <select name="fasesTomate" id="fasesTomate" onchange="selecionarFase()">
                <option value="muda">Estufa de Mudas</option>
                <option value="vegetativa">Estufa Vegetativa</option>
                <option value="reprodutiva">Estufa Reprodutiva</option>
              </select>
            </div>
          </div>
        <!-- Leitura atual (a cor muda pelo JS) -->
        <div class="leitura-atual faixa-alerta" id="cardLeitura">
          <p class="kpi-title">Leitura atual</p>
          <p class="leitura-valor" id="leituraValor">70,1</p>
          <p class="kpi-title">PPFD - (Potencial Fotossintético da Planta)</p>
        </div>  
        
      <h4 class="metricas">Métricas de Controle</h4>
        <!-- Faixas de PPFD (textos preenchidos pelo JS) -->
        <div class="faixas">
          <div class="faixa faixa-critico">
            <p class="faixa-nome">Crítico abaixo</p>
            <p class="faixa-valor" id="faixa1"></p>
            <p class="faixa-nome">PPFD</p>
          </div>
          <div class="faixa faixa-alerta">
            <p class="faixa-nome">Alerta abaixo</p>
            <p class="faixa-valor" id="faixa2"></p>
            <p class="faixa-nome">PPFD</p>
          </div>
          <div class="faixa faixa-adequado">
            <p class="faixa-nome">Adequado</p>
            <p class="faixa-valor" id="faixa3"></p>
            <p class="faixa-nome">PPFD</p>
          </div>
          <div class="faixa faixa-alerta">
            <p class="faixa-nome">Alerta elevado</p>
            <p class="faixa-valor" id="faixa4"></p>
            <p class="faixa-nome">PPFD</p>
          </div>
          <div class="faixa faixa-critico">
            <p class="faixa-nome">Crítico elevado</p>
            <p class="faixa-valor" id="faixa5"></p>
            <p class="faixa-nome">PPFD</p>
          </div>
        </div>
        <!-- Gráfico da leitura -->
        <div class="res">
          <canvas id="myChart"></canvas>
        </div>

      </div>

    </section>
</div>

</body>

</html>
<script>
// Os ids do HTML já viram variáveis globais (igual ao fasesTomate)
let div_result1 = faixa1;
let div_result2 = faixa2;
let div_result3 = faixa3;
let div_result4 = faixa4;
let div_result5 = faixa5;

let div_leitura = leituraValor;
let div_card = cardLeitura;

// Leituras de PPFD ao longo do dia (sensor)
const leiturasDia = [75, 80, 85, 70, 65, 60, 75, 85, 90, 95, 80, 75, 70, 72, 80, 88, 82, 78, 74, 80, 85, 90, 75, 70];

// Leitura atual do sensor (troque pelo valor vindo do Arduino/API)
const leituraAtual = 70.1;
const leituraTexto = "70,1";

let grafico1 = new Chart(myChart, {
      type: 'line',
      data: {
        labels: ['01:00', '02:00', '03:00', '04:00', '05:00', '06:00', '07:00', '08:00', '09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00', '21:00', '22:00', '23:00', '00:00'],
        datasets: [
          {
            label: 'Leitura de PPFD',
            data: leiturasDia,
            borderColor: 'rgba(0, 128, 0, 1)',
            backgroundColor: 'rgba(0, 128, 0, 1)',
            borderWidth: 2
          },
          {
            label: 'Limite superior',
            data: [],
            borderColor: 'rgba(0, 0, 255, 1)',
            backgroundColor: 'rgba(0, 0, 255, 1)',
            borderWidth: 2
          },
          {
            label: 'Limite inferior',
            data: [],
            borderColor: 'rgba(255, 99, 132, 1)',
            backgroundColor: 'rgba(255, 99, 132, 1)',
            borderWidth: 2
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: false
          }
        },
        scales: {
          x: {
            ticks: {
              minRotation: 45,
              maxRotation: 45
            }
          },
          y: {
            beginAtZero: true,
            max: 120
          }
        }
      }
  });

// Preenche as linhas de limite do gráfico (um valor para cada hora)
function atualizarLinhas(b, c) {
  let linhaMin = [];
  let linhaMax = [];
  for (let i = 0; i < 24; i++) {
    linhaMin.push(b);
    linhaMax.push(c);
  }
  grafico1.data.datasets[1].data = linhaMax;
  grafico1.data.datasets[2].data = linhaMin;
  grafico1.update();
}

function atualizarFaixas(fase) {
  let a = 0;
  let b = 0;
  let c = 0;
  let d = 0;

  // Limites de PPFD de cada fase
  if (fase == "muda") {
    a = 45;
    b = 69;
    c = 93;
    d = 115;
  } else if (fase == "vegetativa") {
    a = 115;
    b = 162;
    c = 185;
    d = 230;
  } else {
    a = 175;
    b = 254;
    c = 347;
    d = 400;
  }

  // Textos dos cards de faixa
  div_result1.innerHTML = "<=" + a;
  div_result2.innerHTML = "> " + a + " & <" + b;
  div_result3.innerHTML = ">=" + b + " & <" + c;
  div_result4.innerHTML = ">=" + c + " & <=" + d;
  div_result5.innerHTML = "> " + d;

  // Cor da leitura atual
  let cor = "faixa-alerta";
  if (leituraAtual < a || leituraAtual > d) {
    cor = "faixa-critico";
  } else if (leituraAtual >= b && leituraAtual <= c) {
    cor = "faixa-adequado";
  }

  div_leitura.innerHTML = leituraTexto;
  div_card.className = "leitura-atual " + cor;

  // Linhas de limite no gráfico
  atualizarLinhas(b, c);
}

function selecionarFase() {
  const fase = fasesTomate.value;
  atualizarFaixas(fase);
}

// Ao carregar a página, aplica a fase selecionada
atualizarFaixas(fasesTomate.value);
</script>
