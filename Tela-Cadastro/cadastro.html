<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomatix - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main">       
                                                <!--Navbar e Header-->
        <div class="navbar">
            <a href="../Site-Institucional/site.html">
                <img src="./assets/logoDark.png" class="logo-nav">
            </a>
            <div class="nav-items">
                <a>Calculadora</a>
                <a>Sobre nós</a>
                <a>Contato</a>
                <div class="btns-nav">
                    <button class="btn-branco">Login</button>
                    <button class="btn">Cadastro</button>
                </div>
            </div>
        </div>

        <div class="login-container">
            <div class="foto-container">
                <div>
                    <img src="./assets/logo-branco.png" class="logo-branco">
                </div>
            </div>
                                              <!--Campos e Inputs-->
            <div class="login-content">
                <form class="form-cadastro"> <!--DEIXEI APENAS PARA TESTE, REMOVER O FORM DEPOIS-->
                    <h2>Faça seu cadastro!</h2>
                    <p>Crie agora mesmo a sua conta</p>
                    
                    <div class="campo-grupo">
                        <label for="nomefull">Nome completo</label>
                        <input type="text" id="nomefull" placeholder="Digite seu nome aqui">
                    </div>

                    <div class="campo-grupo">
                        <label for="email">Email:</label> 
                        <input type="email" id="email" placeholder="Digite seu email aqui">
                    </div>

                                                <!--Campo senha-->
                    <div class="senhas-linha">
                        <div class="campo-grupo">
                            <label for="senha">Senha:</label>
                            <input type="password" id="senha" placeholder="Digite sua senha aqui">
                        </div>
                        <div class="campo-grupo">
                            <label for="senhachk">Confirmar senha:</label>
                            <input type="password" id="senhachk" placeholder="Digite sua senha novamente">
                        </div>
                    </div>
                                             <!--Botão Criar conta-->
                    <div class="btns-login">
                        <button type="submit" class="btn">Criar conta</button>
                    </div>
                </form> <!--DEIXEI APENAS PARA TESTE, REMOVER O FORM DEPOIS-->
            </div>
        </div>

                                                <!--Footer-->
        <footer>
            <div class="footer">
                <img src="./assets/Logo-Branca-Tomatix.svg"/>
                <section class="footer-content">
                    <div>
                        <p>Produto</p>
                        <p>Sobre Nós</p>
                    </div>
                    <div>
                        <p>Empresa</p>
                        <p>Contato</p>
                    </div>
                </section>
            </div>       
            <div class="hr"></div>   
            <p class="copy">© 2026 TOMATIX. Todos os direitos reservados.</p>         
        </footer>

    </main>
</body>
</html>
