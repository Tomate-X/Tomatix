<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomatix - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

                        <!--Navbar-->
<div class="home" id="empresa">
    <div class="navbar">
            <div class="btns-nav">
                <a href="#"><button class="btn-branco">Estufas</button></a>
                <a href="#"><button class="btn">Histórico</button></a>
            </div>
        </div>
    </div>
                          <!--Gráfico-->
    <section class="grafico">
      <div class="menu-lateral">
        <select name="fases-tomate" id="fases-tomate">
          <option value="">Muda</option>
          <option value="">Vegetativa</option>
          <option value="">Reprodutiva</option>
        </select>

      </div>
        <div class="grafico-container">
          <!--KPI Leitura atual-->
          <div class="kpis leitura">
            <div>
              <p class="kpi-title">LEITURA ATUAL</p>
              <p class="ppfd-atual">70</p>
              <p class="kpi-title">PPFD</p>
            </div>
              <span class="situacao">ADEQUADO</span>
          </div>

           <!--KPI Métricas-->
          <div class="metricas">
            <div class="kpis adequado">
              <p>>255 & <347 </p>
            </div>
            <div class="kpis abaixo">
              <p><255</p>
            </div>
            <div class="kpis elevado">
              <p>>347</p>
            </div>
          </div>
          <!--Gráfico da leitura-->
            <canvas id="myChart"></canvas>
        </div>
    </section>
   

</body>

</html>
<script>
  const ctx = document.getElementById('myChart');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['13:00', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
      datasets: [{
        label: 'ppfd',
        data: [240, 280, 320, 358, 337, 302], 
        borderColor: 'dark grey',
        backgroundColor:'yellow',
        borderWidth: 1
      },
      {
        label: 'ppfd (Ideal)',
        data: [301, 301, 301, 301, 301, 301], 
        borderColor: 'green', // Cor da linha 
        borderWidth: 2,
        borderDash: [5, 5], // Cria um efeito de linha tracejada
        pointRadius: 0, // Remove os pontos 
      }
    ]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>
